<style>
.selection-outline{transform-origin:0 0;border-width:var(--outline-stroke,2px)}
.selection-outline:after{display:none}

.path-editor .path-handle{fill:#6b4cff;stroke:#fff;stroke-width:1.5}

<style>

:root{--ui-accent:#3AEFD0;--ui-accent-deep:#19cbb2;--ui-menu:#1A232D;--ui-menu-2:#24313d;--ui-menu-line:#344452}

.range input,.toolbar .view-slider{accent-color:var(--ui-accent)}
button{background:var(--ui-accent);color:#102026}
.secondary{background:var(--ui-menu-2);color:#f5fbfa;border:1px solid var(--ui-accent)}
.minor{background:var(--ui-menu-2);color:#eaf5f4;border-color:#526574}

.side-tabs button.active{background:var(--ui-accent);color:#102026}
.side-panel .preset{background:var(--ui-menu-2);color:#f3faf9;border-color:#526574}

.main3-regions{background:var(--ui-menu-2);border-color:#465867}

.main3-region-button.active{border-color:var(--ui-accent);background:#203b3d;color:var(--ui-accent)}
.main3-region-button small{color:#9fb0ba}
.toolbar{background:#111a23;border:1px solid var(--ui-menu-line)}
.toolbar button:hover:not(:disabled){background:#2b3b48;color:var(--ui-accent)}
.edit-toolbar input,.edit-toolbar select{background:#f9fbfc;color:#172033;border-color:#738592}

<body>
<div class="app">
<aside>
  <div class="brand">主图生成器</div>
  <label>场景图</label>
  <label id="dropZone" class="upload" for="file"><b>＋</b><span>上传场景图</span></label>
  <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
  <div id="status" class="status" aria-live="polite"></div>

/* Single-board focus mode: browsing stays read-only until one board is focused. */
const focusReturn=document.createElement("button");
focusReturn.type="button";
focusReturn.className="focus-return";
focusReturn.textContent="返回全部画板";
focusReturn.setAttribute("aria-label","返回全部画板");

focusReturn.hidden=true;

const originalUpdateToolbar=updateToolbar;
let updatingToolbar=false;
updateToolbar=function(){
  if(updatingToolbar)return;
  updatingToolbar=true;
  originalUpdateToolbar();
  updatingToolbar=false;
  syncBackgroundControls();
  const textItem=active&&(
    active.kind==="fixed"||
    ["text","crown","sleepMode","goldBadge"].includes(getItem(active)?.kind)
  );
  const showLayers=inspectorMode==="layers";
  layerList.hidden=!showLayers;
  layerList.style.display=showLayers?"":"none";
  layerDrawerMeta.hidden=!showLayers;
  layerDrawerMeta.style.display=showLayers?"":"none";
  const hasProperty=!!active&&!getItem(active)?.logoOverlay&&!!getStyle(active);
  if(propertyEmpty){
    propertyEmpty.hidden=showLayers||hasProperty;
    propertyEmpty.style.display=showLayers||hasProperty?"none":"";
  }
  if(showLayers)bar.classList.remove("visible");
  layerDrawer.querySelector(".layer-drawer-head h2").textContent=showLayers?"图层信息":"属性";
  layersToggle.classList.toggle("active",showLayers);
  propertiesToggle.classList.toggle("active",!showLayers);
};
function boardFromTarget(target){
  const wrap=target?.closest?.(".board-wrap");
  return boards.find(b=>b.wrap===wrap)||null;
}
function showFocusReturn(show){
  focusReturn.hidden=!show;
  focusReturn.classList.toggle("visible",show);
  layersToggle.hidden=!show;
  propertiesToggle.hidden=!show;
}
function enterFocus(board){
  if(!board||focusMode)return;
  focusSnapshot={view:{...workspaceView},selected,scrollLeft:viewport.scrollLeft,scrollTop:viewport.scrollTop,asideScroll:aside.scrollTop};
  focusMode=true;
  escFitArmed=false;
  focusedBoard=board;
  layerHover=null;
  active=null;
  objectDrag=null;
  if(editing)finishEdit(true);
  if(freeEdit)finishFree(true);
  boards.forEach(b=>b.section.classList.toggle("focused",b===board));
  stage.classList.add("focus-mode","focus-transition");
  showFocusReturn(true);
  openLayerDrawer(board);
  selectBoard(board);
  updateToolbar();
  requestAnimationFrame(()=>fitBoard(board));
  setTimeout(()=>stage.classList.remove("focus-transition"),260);
}
function exitFocus(){
  if(!focusMode)return;
  const snapshot=focusSnapshot;
  if(editing)finishEdit(true);
  if(freeEdit)finishFree(true);
  focusMode=false;
  focusedBoard=null;
  layerHover=null;
  active=null;
  objectDrag=null;
  focusSnapshot=null;
  stage.classList.add("focus-transition");
  stage.classList.remove("focus-mode");
  boards.forEach(b=>b.section.classList.remove("focused"));
  showFocusReturn(false);
  closeLayerDrawer();
  updateToolbar();
  requestAnimationFrame(()=>{
    if(snapshot)Object.assign(workspaceView,snapshot.view);
    applyView();
    if(snapshot?.selected)selectBoard(snapshot.selected);
    if(snapshot){viewport.scrollLeft=snapshot.scrollLeft;viewport.scrollTop=snapshot.scrollTop;aside.scrollTop=snapshot.asideScroll}
    closeLayerDrawer();
    setTimeout(()=>stage.classList.remove("focus-transition"),260);
  });
}
focusReturn.addEventListener("click",()=>{exitFocus();escFitArmed=true});
stage.addEventListener("pointerdown",e=>{
  if(focusMode||spaceDown||e.button!==0)return;
  const board=boardFromTarget(e.target);
  if(!board)return;
  e.preventDefault();
  e.stopPropagation();
  enterFocus(board);
},true);
stage.addEventListener("dblclick",e=>{
  if(focusMode)return;
  const board=boardFromTarget(e.target);
  if(!board)return;
  e.preventDefault();
  e.stopPropagation();
  enterFocus(board);
},true);
const originalSelectObject=selectObject;
selectObject=function(ref){if(!focusMode)return;return originalSelectObject(ref)};
const originalStartEdit=startEdit;
startEdit=function(b,type){if(!focusMode)return;return originalStartEdit(b,type)};
const originalEditFree=editFree;
editFree=function(item){if(!focusMode)return;return originalEditFree(item)};
const originalAddExtra=addExtra;
addExtra=function(...args){if(!focusMode)return;return originalAddExtra(...args)};
const originalAddSleepModePreset=addSleepModePreset;

const originalDeleteSelectedElement=deleteSelectedElement;
deleteSelectedElement=function(){if(!focusMode)return;return originalDeleteSelectedElement()};
const originalBeginResize=beginResize;
beginResize=function(...args){if(!focusMode)return;return originalBeginResize(...args)};
const originalBeginPathGesture=beginPathGesture;
