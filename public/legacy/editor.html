<body>
<div class="app">

<main>

</div>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const templateId=new URLSearchParams(location.search).get("template")||"1";
const templateNames={"1":"沙发模板1","2":"沙发模板2","3":"沙发模板3",custom:"自定义模板"};
const templateName=templateNames[templateId]||templateNames["1"];
const isSofaTemplate1=templateId==="1"||!templateNames[templateId];
if(templateId==="2")document.body.classList.add("sofa-template-2");
const editorHome=document.querySelector(".editor-home");
editorHome?.addEventListener("click",event=>{
  if(window.parent===window)return;
  event.preventDefault();
  window.parent.location.hash="/";
});
$("templateTitle").textContent="主图模板·"+templateName;
document.title="主图生成器 · "+templateName;
const boardDefinitions=[
  {key:"square",name:"主图1-方图",w:1440,h:1440,fit:"contain",kind:"square",group:"mother",text1:isSofaTemplate1?"高奢半青皮":"",text2:isSofaTemplate1?"解放双手 语音智控":""},
  ...Array.from({length:5},(_,i)=>({key:"portrait"+(i+1),name:"主图"+(i+1)+"-竖版",w:1440,h:1920,fit:"cover",kind:"portrait",group:i===0?"mother":null,text1:isSofaTemplate1?(i===0?"高奢半青皮":i===1?"全新离线语音智控\n身随声动，更方便":""):"",text2:isSofaTemplate1&&i===0?"解放双手 语音智控":""})),
  ...Array.from({length:4},(_,i)=>({key:"square"+(i+2),name:"主图"+(i+2)+"-方图",w:1440,h:1440,fit:"cover",kind:"square",group:null,text1:"",text2:""}))
];
const boards=boardDefinitions.map(d=>({...d,image:null,x:0,y:0,zoom:1,maxZoom:3,textOffsets:{title:{x:0,y:0},sub:{x:0,y:0}}}));
const boardByKey=Object.fromEntries(boards.map(b=>[b.key,b]));
let selected=boards[0],imageDrag=null,spaceDown=false,workspacePan=null,editing=null,sliderEditing=false,defaultImagesReady=Promise.resolve();
const undoStack=[],redoStack=[],MAX_HISTORY=80;
const viewport=$("workspaceViewport"),stage=$("workspaceStage"),zoom=$("zoom"),zoomText=$("zoomText"),viewSlider=$("workspaceZoom");
const workspaceView={scale:1,x:0,y:0};
let focusMode=false,focusedBoard=null,focusSnapshot=null,escFitArmed=false;
function makeBoard(b){
  const section=document.createElement("section");
  section.className="artboard-section "+(b.kind==="square"?"square-section":"portrait-section");
  section.innerHTML='<div class="board-title"><span>'+b.name+'</span><small>'+b.w+' × '+b.h+' px</small></div><div class="board-wrap '+b.kind+' '+b.key+' show-safe"><canvas width="'+b.w+'" height="'+b.h+'"></canvas><i class="safe top"></i><i class="safe bottom"></i><i class="safe left"></i><i class="safe right"></i><span class="board-badge">'+b.name+'</span></div>';
  (b.kind==="square"?$("squareRow"):$("portraitRow")).appendChild(section);
  b.section=section;b.wrap=section.querySelector(".board-wrap");b.canvas=section.querySelector("canvas");
  b.title=section.querySelector(".board-title");b.hints=[];
  b.wrap.addEventListener("pointerdown",()=>selectBoard(b));
  b.title.addEventListener("dblclick",()=>{selectBoard(b);fitBoard(b)});
  b.wrap.addEventListener("dblclick",e=>{if(spaceDown)return;const point=boardPoint(b,e);const type=hitText(b,point.x,point.y);if(type){e.preventDefault();startEdit(b,type)}});
  b.canvas.addEventListener("pointerdown",e=>startImageDrag(b,e));
  b.canvas.addEventListener("pointermove",e=>moveImageDrag(b,e));
  b.canvas.addEventListener("pointerup",endImageDrag);
  b.canvas.addEventListener("pointercancel",endImageDrag);
  b.canvas.addEventListener("wheel",e=>wheelImage(b,e),{passive:false});
}
boards.forEach(makeBoard);
const layerDrawer=$("layerDrawer"),layerDrawerMeta=$("layerDrawerMeta"),layerList=$("layerList"),propertyEmpty=$("propertyEmpty");
let inspectorMode="layers";
function layerNumber(value){return Number.isFinite(Number(value))?Number(value).toFixed(2).replace(/\.00$/,""):"-"}
function groupedItems(b,it){return it?.groupId?(b.extra||[]).filter(x=>x.groupId===it.groupId):it?[it]:[]}
function groupedBounds(b,it){const items=groupedItems(b,it);if(!items.length)return it;const boxes=items.map(item=>item.kind==="text"?textItemInkBounds(b,item):item),x=Math.min(...boxes.map(box=>box.x)),y=Math.min(...boxes.map(box=>box.y)),r=Math.max(...boxes.map(box=>box.x+box.w)),bottom=Math.max(...boxes.map(box=>box.y+box.h));return{x,y,w:r-x,h:bottom-y,rotation:0}}
function layerRows(b){
  const rows=[],groups=new Set();
  if(b.text1)rows.push({name:"卖点 1",type:"fixed",ref:{b,kind:"fixed",type:"title"},text:b.text1,box:bounds({b,kind:"fixed",type:"title"})});
  if(b.text2)rows.push({name:"卖点 2",type:"fixed",ref:{b,kind:"fixed",type:"sub"},text:b.text2,box:bounds({b,kind:"fixed",type:"sub"})});
  (b.extra||[]).forEach((it,index)=>{
    if(it.logoOverlay)return;
    if(it.groupId){if(groups.has(it.groupId))return;groups.add(it.groupId)}
    if(it.kind==="templateOutline"&&it.componentId)return;
    const isComponent=!!it.componentId;
    rows.push({name:it.groupId?`${it.layerLabel||"路径"}组`:(isComponent?`金标组件 · ${it.text||"文字"}`:(it.layerLabel||it.pathLabel||it.text||({templateOutline:"白色圆角线框",goldBadge:"金标组件",sleepMode:"睡眠模式",crown:"皇冠组件",presetComponent:"模板组件",path:"路径标注",image:"图片组件"}[it.kind]||`组件 ${index+1}`))),type:it.groupId?"group":(isComponent?"component":it.kind),ref:{b,kind:"extra",id:it.id},locked:!!it.locked,text:it.text,box:it.groupId?groupedBounds(b,it):(isComponent||it.kind==="text"?bounds({b,kind:"extra",id:it.id}):it)})
  });
  return rows
}
function updateLayerDrawer(b){
  if(!b||!layerDrawer)return;
  layerDrawerMeta.textContent=`${b.name} · ${b.w} × ${b.h}px · ${layerRows(b).length} 个图层`;
  layerList.textContent="";
  const rows=layerRows(b);
  if(!rows.length){layerList.innerHTML='<div class="layer-empty">当前画板暂无图层</div>';return}
  rows.forEach(row=>{
    const button=document.createElement("div");button.className="layer-row";button.setAttribute("role","button");button.tabIndex=0;
    const box=row.box||{};
    button.innerHTML=`<div class="layer-row-content"><strong>${row.name}</strong><small>类型：${row.type} · 位置：${layerNumber(box.x)}，${layerNumber(box.y)} · 尺寸：${layerNumber(box.w)} × ${layerNumber(box.h)}${row.text?`<br>文字：${row.text.replace(/</g,"&lt;")}`:""}</small></div>`;
    if(row.ref){
      button.addEventListener("mouseenter",()=>previewLayer(row.ref));
      button.addEventListener("mouseleave",()=>clearLayerPreview(row.ref));
      button.classList.toggle("selected",isRefSelected(row.ref));
      button.addEventListener("click",e=>{
        if(e.target.closest(".layer-delete"))return;
        if(row.ref.kind==="background"){
          layerHover=null;active=null;selectedRefs=[];selectBoard(row.ref.b);drawOutline(row.ref.b);updateToolbar();
        }else selectObject(row.ref,{additive:e.shiftKey,toggle:e.shiftKey});
      });
      button.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();button.click()}});
      button.addEventListener("contextmenu",e=>{e.preventDefault();e.stopPropagation();openLayerContextMenu(row.ref,e.clientX,e.clientY)});
      if(row.ref.kind!=="background"&&!row.locked){
        const remove=document.createElement("button");remove.type="button";remove.className="layer-delete";remove.textContent="删除";remove.title=`删除${row.name}`;
        remove.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();deleteLayerRef(row.ref)});
        button.appendChild(remove);
      }
    }else button.setAttribute("aria-disabled","true");
    layerList.appendChild(button)
  });
}
function closeLayerDrawer(){document.querySelector(".app").classList.remove("inspector-open");layerDrawer.classList.remove("visible");layerDrawer.setAttribute("aria-hidden","true")}
function setInspectorMode(mode){
  inspectorMode=mode==="properties"?"properties":"layers";
  layerDrawer.dataset.mode=inspectorMode;
  const showLayers=inspectorMode==="layers";
  layerList.hidden=!showLayers;
  layerList.style.display=showLayers?"":"none";
  layerDrawerMeta.hidden=!showLayers;
  layerDrawerMeta.style.display=showLayers?"":"none";
  if(propertyEmpty){
    propertyEmpty.hidden=showLayers||!!active;
    propertyEmpty.style.display=showLayers||!!active?"none":"";
  }
  const title=layerDrawer.querySelector(".layer-drawer-head h2");
  if(title)title.textContent=showLayers?"图层信息":"属性";
  layerDrawer.setAttribute("aria-label",showLayers?"图层信息":"属性");
  $("layerDrawerClose").setAttribute("aria-label",showLayers?"关闭图层信息":"关闭属性面板");
  document.querySelectorAll(".inspector-toggle").forEach(button=>button.classList.toggle("active",button.dataset.inspector===inspectorMode));
  if(typeof updateToolbar==="function")updateToolbar();
}
function openLayerDrawer(b,mode="layers"){
  if(!focusMode||b!==focusedBoard)return;
  updateLayerDrawer(b);
  document.querySelector(".app").classList.add("inspector-open");
  layerDrawer.classList.add("visible");
  layerDrawer.setAttribute("aria-hidden","false");
  setInspectorMode(mode);
}
$("layerDrawerClose").addEventListener("click",()=>{closeLayerDrawer();requestAnimationFrame(()=>{if(focusMode)fitBoard(focusedBoard)})});
function deleteLayerRef(ref){
  if(!ref||ref.kind==="background")return;
  const item=getItem(ref);
  if(item?.locked)return;
  selectObject(ref);
  deleteSelectedElement();
}
function snapshot(){return boards.map(b=>({key:b.key,image:b.image,x:b.x,y:b.y,zoom:b.zoom,text1:b.text1,text2:b.text2}))}
function sameSnapshot(a,b){return a.every((s,i)=>{const t=b[i];return s.image===t.image&&s.x===t.x&&s.y===t.y&&s.zoom===t.zoom&&s.text1===t.text1&&s.text2===t.text2})}
function updateUndoButtons(){$("undo").disabled=!undoStack.length}
function pushHistory(){const current=snapshot();undoStack.push(current);if(undoStack.length>MAX_HISTORY)undoStack.shift();redoStack.length=0;updateUndoButtons()}
function restore(state){state.forEach(s=>{const b=boardByKey[s.key];Object.assign(b,{image:s.image,x:s.x,y:s.y,zoom:s.zoom,text1:s.text1,text2:s.text2})});renderAll();selectBoard(selected)}
function undo(){if(!undoStack.length)return;redoStack.push(snapshot());restore(undoStack.pop());updateUndoButtons()}
function redo(){if(!redoStack.length)return;undoStack.push(snapshot());restore(redoStack.pop());updateUndoButtons()}
function selectBoard(b){selected=b;boards.forEach(x=>x.wrap.classList.toggle("selected",x===b));$("selectedNote").textContent="当前画板："+b.name;zoom.min=b.kind==="portrait"?100:50;zoom.value=Math.round(b.zoom*100);zoomText.textContent=zoom.value+"%";$("exportCurrent").textContent="导出"+b.name+" JPG（"+b.w+"×"+b.h+"）";updateLayerDrawer(b)}
function fontStack(type){return type==="title"?'Montserrat,FZTitle,"Microsoft YaHei"':'Montserrat,FZSub,"Microsoft YaHei"'}
function textSpec(b,type){const offset=b.textOffsets?.[type]||{x:0,y:0};const base=b.key==="portrait2"&&type==="title"?{x:60,y:234,h:222,size:78,lineHeight:94,letterSpacing:1.95}:(()=>{const p=b.kind==="portrait";return type==="title"?(p?{y:310,h:134,r:67,pad:79,size:100}:{y:190,h:116,r:58,pad:70,size:90}):(p?{y:464,h:94,r:47,pad:61,size:80}:{y:326,h:94,r:47,pad:52,size:70})})();return{...base,x:(base.x||0)+offset.x,y:base.y+offset.y,offsetX:offset.x,offsetY:offset.y}}
function fitFont(ctx,text,target,family,max,min=30){let size=target;while(size>min){ctx.font=size+"px "+family;if(ctx.measureText(text).width<=max)return size;size--}return size}

  renderAll()
})();

    "logo-square.png","logo-portrait.png","watermark-square.png","watermark-portrait.png"

$("logoToggle").addEventListener("change",()=>{if(active?.kind==="extra"&&getItem(active)?.logoOverlay&&!$("logoToggle").checked)deselect();renderAll()});
$("watermarkToggle").addEventListener("change",renderAll);
document.fonts.ready.then(renderAll);
selectBoard(selected);applyView();renderAll();updateUndoButtons();
requestAnimationFrame(fitWorkspace);
boardByKey.square5.y=190;
defaultImagesReady=Promise.all([...(isSofaTemplate1?[loadDefaultImage(boards[0],"/assets/main1-square.jpg"),loadDefaultImage(boards[1],"/assets/main1-portrait.jpg"),loadDefaultImage(boards[2],"/assets/main2-portrait.jpg"),loadDefaultImage(boardByKey.portrait4,"/assets/main4-portrait.jpg"),loadDefaultImage(boardByKey.square2,"/assets/main2-portrait.jpg"),loadDefaultImage(boardByKey.square3,"/assets/main3-square-background.jpg"),loadDefaultImage(boardByKey.square4,"/assets/main4-square-background.jpg"),loadDefaultImage(boardByKey.square5,"/assets/main5-top.jpg")]:[]),sofaTemplate2Ready,squareTemplatesReady,overlayAssetsReady,sleepModeReady]);
defaultImagesReady.then(()=>requestAnimationFrame(fitWorkspace),()=>requestAnimationFrame(fitWorkspace));

/* Single-board focus mode: browsing stays read-only until one board is focused. */
const focusReturn=document.createElement("button");
focusReturn.type="button";
focusReturn.className="focus-return";
focusReturn.textContent="返回全部画板";
focusReturn.setAttribute("aria-label","返回全部画板");
viewport.appendChild(focusReturn);
focusReturn.hidden=true;
const layersToggle=document.createElement("button");
layersToggle.type="button";
layersToggle.className="inspector-toggle";
layersToggle.dataset.inspector="layers";
layersToggle.textContent="图层";
layersToggle.setAttribute("aria-label","打开图层面板");
layersToggle.hidden=true;
document.querySelector(".toolbar").appendChild(layersToggle);
const propertiesToggle=document.createElement("button");
propertiesToggle.type="button";
propertiesToggle.className="inspector-toggle";
propertiesToggle.dataset.inspector="properties";
propertiesToggle.textContent="属性";
propertiesToggle.setAttribute("aria-label","打开属性面板");
propertiesToggle.hidden=true;
document.querySelector(".toolbar").appendChild(propertiesToggle);
layersToggle.addEventListener("click",()=>{openLayerDrawer(focusedBoard,"layers");requestAnimationFrame(()=>fitBoard(focusedBoard))});
propertiesToggle.addEventListener("click",()=>{openLayerDrawer(focusedBoard,"properties");requestAnimationFrame(()=>fitBoard(focusedBoard))});
const originalUpdateToolbar=updateToolbar;
let updatingToolbar=false;
updateToolbar=function(){
  if(updatingToolbar)return;
  updatingToolbar=true;
  originalUpdateToolbar();
  updatingToolbar=false;
  syncBackgroundControls();
  const textItem=active&&(
    active.kind==="fixed"||
    ["text","crown","sleepMode","goldBadge"].includes(getItem(active)?.kind)
  );
  const showLayers=inspectorMode==="layers";
  layerList.hidden=!showLayers;
  layerList.style.display=showLayers?"":"none";
  layerDrawerMeta.hidden=!showLayers;
  layerDrawerMeta.style.display=showLayers?"":"none";
  const hasProperty=!!active&&!getItem(active)?.logoOverlay&&!!getStyle(active);
  if(propertyEmpty){
    propertyEmpty.hidden=showLayers||hasProperty;
    propertyEmpty.style.display=showLayers||hasProperty?"none":"";
  }
  if(showLayers)bar.classList.remove("visible");
  layerDrawer.querySelector(".layer-drawer-head h2").textContent=showLayers?"图层信息":"属性";
  layersToggle.classList.toggle("active",showLayers);
  propertiesToggle.classList.toggle("active",!showLayers);
};
function boardFromTarget(target){
  const wrap=target?.closest?.(".board-wrap");
  return boards.find(b=>b.wrap===wrap)||null;
}
function showFocusReturn(show){
  focusReturn.hidden=!show;
  focusReturn.classList.toggle("visible",show);
  layersToggle.hidden=!show;
  propertiesToggle.hidden=!show;
}
function enterFocus(board){
  if(!board||focusMode)return;
  focusSnapshot={view:{...workspaceView},selected,scrollLeft:viewport.scrollLeft,scrollTop:viewport.scrollTop,asideScroll:aside.scrollTop};
  focusMode=true;
  escFitArmed=false;
  focusedBoard=board;
  layerHover=null;
  active=null;
  selectedRefs=[];
  objectDrag=null;
  if(editing)finishEdit(true);
  if(freeEdit)finishFree(true);
  boards.forEach(b=>b.section.classList.toggle("focused",b===board));
  stage.classList.add("focus-mode","focus-transition");
  showFocusReturn(true);
  openLayerDrawer(board);
  selectBoard(board);
  updateToolbar();
  requestAnimationFrame(()=>fitBoard(board));
  setTimeout(()=>stage.classList.remove("focus-transition"),260);
}
function exitFocus(){
  if(!focusMode)return;
  const snapshot=focusSnapshot;
  if(penMode)cancelPenTool("");
  if(editing)finishEdit(true);
  if(freeEdit)finishFree(true);
  focusMode=false;
  focusedBoard=null;
  layerHover=null;
  active=null;
  selectedRefs=[];
  objectDrag=null;
  focusSnapshot=null;
  stage.classList.add("focus-transition");
  stage.classList.remove("focus-mode");
  boards.forEach(b=>b.section.classList.remove("focused"));
  showFocusReturn(false);
  closeLayerDrawer();
  updateToolbar();
  requestAnimationFrame(()=>{
    if(snapshot)Object.assign(workspaceView,snapshot.view);
    applyView();
    if(snapshot?.selected)selectBoard(snapshot.selected);
    if(snapshot){viewport.scrollLeft=snapshot.scrollLeft;viewport.scrollTop=snapshot.scrollTop;aside.scrollTop=snapshot.asideScroll}
    closeLayerDrawer();
    setTimeout(()=>stage.classList.remove("focus-transition"),260);
  });
}
focusReturn.addEventListener("click",()=>{exitFocus();escFitArmed=true});
stage.addEventListener("pointerdown",e=>{
  if(focusMode||spaceDown||e.button!==0)return;
  const board=boardFromTarget(e.target);
  if(!board)return;
  e.preventDefault();
  e.stopPropagation();
  enterFocus(board);
},true);
stage.addEventListener("dblclick",e=>{
  if(focusMode)return;
  const board=boardFromTarget(e.target);
  if(!board)return;
  e.preventDefault();
  e.stopPropagation();
  enterFocus(board);
},true);
const originalSelectObject=selectObject;
selectObject=function(ref,...args){if(!focusMode)return;return originalSelectObject(ref,...args)};
const originalStartEdit=startEdit;
startEdit=function(b,type){if(!focusMode)return;return originalStartEdit(b,type)};
const originalEditFree=editFree;
editFree=function(item){if(!focusMode)return;return originalEditFree(item)};
const originalAddExtra=addExtra;
addExtra=function(...args){if(!focusMode)return;return originalAddExtra(...args)};
const originalAddSleepModePreset=addSleepModePreset;
addSleepModePreset=function(){if(!focusMode)return;return originalAddSleepModePreset()};
const originalDeleteSelectedElement=deleteSelectedElement;
deleteSelectedElement=function(){if(!focusMode)return;return originalDeleteSelectedElement()};
const originalBeginResize=beginResize;
beginResize=function(...args){if(!focusMode)return;return originalBeginResize(...args)};
const originalBeginPathGesture=beginPathGesture;
beginPathGesture=function(...args){if(!focusMode)return;return originalBeginPathGesture(...args)};
})();
